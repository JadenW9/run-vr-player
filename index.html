<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare 360 VR Player</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 1.4rem;
      z-index: 100;
    }
    #loading.hidden { display: none; }

    #mode-switcher {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 50;
      font-family: sans-serif;
    }
    #mode-switcher button {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      background: #1a3a5c;
      color: white;
      transition: background 0.2s;
    }
    #mode-switcher button:hover, #mode-switcher button.active { 
      background: #4fc3f7; 
      color: #000; 
    }

    .url-input {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      width: 360px;
      background: #111e2b;
      color: white;
    }
  </style>
</head>
<body>

  <div id="loading" class="hidden">Loading Cloudflare 360 Stream...</div>

  <div id="mode-switcher">
    <input
      id="video-url-input"
      class="url-input"
      type="text"
      placeholder="Paste Cloudflare Video ID or .m3u8 URL"
      value=""
    />
    <button id="btn-360" class="active" onclick="switchMode('360')">360 Mode</button>
    <button id="btn-flat" onclick="switchMode('flat')">Flat Screen</button>
    <button id="btn-load-stream" onclick="loadActiveStream()">Load Stream</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
    background="color: #0a0a1a"
  >

    <a-assets timeout="5000">
      <img id="sky-tex" src="https://cdn.aframe.io/a-painter/images/sky.jpg" crossorigin="anonymous" />
      <!-- crossorigin required for WebGL texture mapping on Cloudflare Stream -->
      <video id="video360" playsinline webkit-playsinline crossorigin="anonymous" loop></video>
      <video id="videoFlat" playsinline webkit-playsinline crossorigin="anonymous" loop src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
    </a-assets>

    <a-sky id="bg-sky" src="#sky-tex" rotation="0 -90 0" visible="false"></a-sky>

    <!-- 360 Videosphere -->
    <a-videosphere
      id="videosphere"
      src="#video360"
      rotation="0 -90 0"
      visible="true"
    ></a-videosphere>

    <!-- Elevated Flat Screen -->
    <a-plane
      id="video-screen"
      position="0 3.2 -4"
      width="7" height="3.93"
      material="src: #videoFlat; shader: flat"
      visible="false"
    ></a-plane>

    <!-- In-VR Play/Pause Toggle -->
    <a-box
      id="vr-play-btn"
      position="0 1.2 -2.5"
      width="1.8" height="0.5" depth="0.2"
      color="#4fc3f7"
      class="clickable"
    >
      <a-text id="vr-play-text" value="Play / Pause 360" align="center" position="0 0 0.12" color="black" width="4.5"></a-text>
    </a-box>

    <a-entity position="0 1.6 0">
      <a-camera look-controls="pointerLockEnabled: false" wasd-controls="enabled: false" fov="80">
        <a-cursor
          color="#4fc3f7"
          fuse="true"
          fuse-timeout="650"
          raycaster="objects: .clickable; interval: 10; far: 12"
        ></a-cursor>
      </a-camera>
    </a-entity>

    <a-light type="ambient" color="#fff" intensity="1.5"></a-light>

    <a-entity laser-controls="hand: left" raycaster="objects: .clickable; interval: 10; far: 12"></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .clickable; interval: 10; far: 12"></a-entity>

  </a-scene>

  <script>
    let currentMode = '360';
    let hlsInstance = null;

    // Resolves raw Cloudflare Video IDs, iframe links, or direct .m3u8 manifests
    function parseCloudflareStreamUrl(rawInput) {
      const input = rawInput.trim();
      if (!input) return '';

      // 32-character Cloudflare Video UID (e.g. ea95132c15732412d22c1476fa77f275)
      if (/^[a-f0-9]{32}$/i.test(input)) {
        return `https://videodelivery.net/${input}/manifest/video.m3u8`;
      }

      // Cloudflare iframe embed link (e.g. https://iframe.videodelivery.net/VIDEO_ID)
      const cfMatch = input.match(/(?:videodelivery\.net|cloudflarestream\.com)\/([a-f0-9]{32})/i);
      if (cfMatch) {
        return `https://videodelivery.net/${cfMatch[1]}/manifest/video.m3u8`;
      }

      return input;
    }

    function getActiveVideo() {
      return currentMode === '360' ? document.getElementById('video360') : document.getElementById('videoFlat');
    }

    function togglePlayback() {
      const vid = getActiveVideo();
      if (vid.paused) {
        vid.play().catch(err => console.error('Playback error:', err));
      } else {
        vid.pause();
      }
    }

    function loadActiveStream() {
      const rawInput = document.getElementById('video-url-input').value;
      const manifestUrl = parseCloudflareStreamUrl(rawInput);
      
      if (!manifestUrl) return;

      const vid = getActiveVideo();
      document.getElementById('loading').classList.remove('hidden');

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (Hls.isSupported() && (manifestUrl.includes('.m3u8') || manifestUrl.includes('videodelivery.net'))) {
        hlsInstance = new Hls({
          capLevelToPlayerSize: false, // Ensures full 4K/VR resolution rendering
          maxBufferLength: 30,
          enableWorker: true
        });

        hlsInstance.attachMedia(vid);
        hlsInstance.loadSource(manifestUrl);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          vid.play().then(() => {
            document.getElementById('loading').classList.add('hidden');
          }).catch(() => {
            document.getElementById('loading').classList.add('hidden');
          });
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error('Cloudflare HLS Fatal Error:', data);
            document.getElementById('loading').classList.add('hidden');
          }
        });
      } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari native HLS fallback
        vid.src = manifestUrl;
        vid.load();
        vid.play().finally(() => document.getElementById('loading').classList.add('hidden'));
      } else {
        vid.src = manifestUrl;
        vid.load();
        vid.play().finally(() => document.getElementById('loading').classList.add('hidden'));
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-360').classList.toggle('active', mode === '360');
      document.getElementById('btn-flat').classList.toggle('active', mode === 'flat');

      const is360 = mode === '360';
      document.getElementById('videosphere').setAttribute('visible', is360);
      document.getElementById('video-screen').setAttribute('visible', !is360);
      document.getElementById('bg-sky').setAttribute('visible', !is360);

      loadActiveStream();
    }

    document.querySelector('a-scene').addEventListener('loaded', () => {
      const sceneEl = document.querySelector('a-scene');

      document.getElementById('vr-play-btn').addEventListener('click', togglePlayback);

      sceneEl.addEventListener('enter-vr', () => {
        document.getElementById('mode-switcher').style.display = 'none';
        const vid = getActiveVideo();
        if (vid) vid.play().catch(e => console.log('Resume prevented on VR enter:', e));
      });

      sceneEl.addEventListener('exit-vr', () => {
        document.getElementById('mode-switcher').style.display = 'flex';
      });

      document.querySelectorAll('.clickable').forEach(el => {
        let origColor = el.getAttribute('color');
        el.addEventListener('mouseenter', () => el.setAttribute('color', '#38b6ff'));
        el.addEventListener('mouseleave', () => el.setAttribute('color', origColor));
      });
    });
  </script>
</body>
</html>
