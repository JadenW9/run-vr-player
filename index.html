<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Player</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }

    /* youtube iframe container floats over the aframe  */
    #yt-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -62%);
      width: 854px;
      height: 480px;
      z-index: 10;
      pointer-events: auto;
    }
    #yt-player { 
      width: 100%; 
      height: 100%; 
    }

    /* loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 1.4rem;
      z-index: 100;
    }
    #loading.hidden { 
      display: none; 
    }

    /* mode switcher UI */
    #mode-switcher {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 50;
      font-family: sans-serif;
    }
    #mode-switcher button {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      background: #1a3a5c;
      color: white;
      transition: background 0.2s;
    }
    #mode-switcher button:hover { background: #4fc3f7; color: #000; }
    #mode-switcher button.active { background: #4fc3f7; color: #000; }

    #video-id-input {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      width: 200px;
      background: #111e2b;
      color: white;
    }
    #video-360-input {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      background: #111e2b;
      color: white;
}
#video-360-input::placeholder { color: #556; }
#video-id-input::placeholder { color: #556; }
  </style>
</head>
<body>

  <!-- loading overlay -->
  <div id="loading">Loading VR Player...<br><small>(Please wait)</small></div>

  <!-- youtube player container on top of aframe canvas -->
  <div id="yt-container">
    <div id="yt-player"></div>
  </div>

  <!--  mode switcher -->
  <div id="mode-switcher">
    <input
      id="video-id-input"
      type="text"
      placeholder="Youtube Video ID"
      value="yu8ShH3GQFU"
    />
  <!-- 360 URL input -->
  <input
    id="video-360-input"
    type="text"
    placeholder="360° Video URL (.mp4)"
    style="display: none; width: 280px;"
  />
  <button id="btn-flat" class="active" onclick="switchMode('flat')">
    Youtube Mode
  </button>
  <button id="btn-360" onclick="switchMode('360')">
    360° Mode
  </button>
  <!-- load button for 360 mode -->
  <button
    id="btn-load-360"
    style="display: none;"
    onclick="load360Video()"
  >
    ▶ Load
  </button>
  </div>

  <!-- aframe scene for VR video playback -->
  <a-scene
    vr-mode-ui="enabled: true"
    renderer="antialias: true; 
    colorManagement: true"
    background="color: #0a0a1a"
  >

    <!-- assets for video and sky -->
    <a-assets>
      <img id="sky-tex"
        src="https://cdn.aframe.io/a-painter/images/sky.jpg"
        crossorigin="anonymous" />

      <!-- 360 video asset (used in 360 mode only) source =uploaded file -->
      <video
        id="video360"
        src="about:blank" 
        playsinline
        crossorigin="anonymous"
        muted
        loop
      ></video>
    </a-assets>

    <!-- sky background for flat mode -->
    <a-sky id="bg-sky" src="#sky-tex" rotation="0 -90 0"></a-sky>

    <!-- 360 sphere  -->
    <a-videosphere
      id="videosphere"
      src="#video360"
      rotation="0 -90 0"
      visible="false"
    ></a-videosphere>

    <!-- main video screen (youtube container floats over) -->
    <a-plane
      id="video-screen"
      position="0 1.6 -4"
      width="7" height="3.9"
      color="#111111"
      material="shader: flat"
    ></a-plane>

    <!-- VR menu toggle button (hover to open) -->
    <a-box
      id="vr-menu-toggle"
      position="5 2.2 -5"
      width="1.8" height="0.45" depth="0.1"
      color="#1a3a5c"
      class="clickable"
    >
      <a-text
        value="⚙  Menu"
        align="center"
        position="0 0 0.06"
        color="white"
        width="4"
      ></a-text>
    </a-box>

    <!-- VR menu panel -->
    <a-entity id="vr-menu" position="0 1.6 -2" visible="false">

      <!-- panel background -->
      <a-plane
        width="3.5" height="4"
        color="#0d1b2a"
        material="opacity: 0.95; shader: flat"
        position="0 0 0"
        data-no-raycast
      ></a-plane>

      <!-- menu title -->
      <a-text
        value="SELECT MODE"
        align="center"
        position="0 1.1 0.01"
        color="#4fc3f7"
        width="6"
      ></a-text>

      <!-- yt mode button -->
      <a-box
        id="vr-btn-flat"
        position="0 0.45 0.05"
        width="2" height="0.4" depth="0.1"
        color="#1a3a5c"
        class="clickable"
      >
        <a-text
          value="Youtube Video"
          align="center"
          position="0 0 0.06"
          color="white"
          width="5"
        ></a-text>
      </a-box>

      <!-- 360 mode button -->
      <a-box
        id="vr-btn-360"
        position="0 -0.1 0.05"
        width="2" height="0.4" depth="0.1"
        color="#1a3a5c"
        class="clickable"
      >
        <a-text
          value="360 Video"
          align="center"
          position="0 0 0.06"
          color="white"
          width="3.5"
        ></a-text>
      </a-box>
      <a-box
          id="vr-btn-keyboard"
          position="0 -0.85 0.05"
          width="2" height="0.4" depth="0.1"
          color="#2e6b3e"
          class="clickable"
          visible="false"
>
        <a-text
          value=" Type 360 URL"
          align="center"
          position="0 0 0.06"
          color="white"
          width="3.5"
></a-text>
</a-box>

      <!-- close menu button -->
      <a-box
        id="vr-btn-close"
        position="0 -1.4 0.05"
        width="2.6" height="0.45" depth="0.1"
        color="#5c1a1a"
        class="clickable"
      >
        <a-text
          value="✕  Close"
          align="center"
          position="0 0 0.06"
          color="white"
          width="3.5"
        ></a-text>
      </a-box>
        
    </a-entity>
    

    <!-- camera  -->
    <a-entity position="0 1.6 0">
      <a-camera
        look-controls="pointerLockEnabled: false"
        wasd-controls="enabled: false"
        fov="80"
      >
        <!-- cursor for hover/controller interaction -->
        <a-cursor
          color="#4fc3f7"
          fuse="true"
          fuse-timeout="1500"
          raycaster="objects: .clickable"
          animation__click="
            property: scale;
            startEvents: click;
            easing: easeInCubic;
            dur: 150;
            from: 0.1 0.1 0.1;
            to: 1 1 1"
        ></a-cursor>
      </a-camera>
    </a-entity>

    <!-- floor -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="30" height="30"
      color="#0d1b2a"
      material="shader: flat"
    ></a-plane>

    <a-light type="ambient" color="#334" intensity="2"></a-light>

<!-- left controller laser pointer -->
<a-entity
  laser-controls="hand: left"
  raycaster="objects: .clickable; far: 10"
></a-entity>

<!-- right controller laser pointer -->
<a-entity
  laser-controls="hand: right"
  raycaster="objects: .clickable; far: 10"
></a-entity>

<!-- VR keyboard panel -->
<a-entity id="vr-keyboard-panel" position="0 1.6 -1.5" visible="false">

  <!-- panel background -->
  <a-plane
    width="3.8" height="3.2"
    color="#0a1628"
    material="opacity: 0.97; shader: flat"
  ></a-plane>

  
  <a-text
    value="ENTER 360 VIDEO URL"
    align="center"
    position="0 1.4 0.01"
    color="#4fc3f7"
    width="3.5"
  ></a-text>

  <!-- URL display -->
  <a-plane
    width="3.4" height="0.35"
    color="#050e1a"
    material="shader: flat"
    position="0 1.0 0.01"
  ></a-plane>
  <a-text
    id="vr-input-display"
    value="Type URL here..."
    align="left"
    position="-1.6 1.0 0.02"
    color="#a0d8ef"
    width="3.5"
  ></a-text>

  <!-- keyboard keys injected here -->
  <a-entity id="vr-keyboard"></a-entity>

  <!-- close keyboard button -->
  <a-box
    id="vr-keyboard-close"
    position="0 -1.45 0.05"
    width="1.4" height="0.3" depth="0.08"
    color="#5c1a1a"
    class="clickable"
  >
    <a-text
      value="✕  Cancel"
      align="center"
      position="0 0 0.05"
      color="white"
      width="3.5"
    ></a-text>
  </a-box>

</a-entity>

  </a-scene>

  <script>
    //configuring mode - 'flat' for Youtube , '360' for downloaded video
    let currentMode = 'flat';
    let ytPlayer = null;

    //flat mode on mode switch
    const flatFrameIds = ['video-screen'];

    //show or hide flat mode elements
    function showFlatElements(visible) {
      flatFrameIds.forEach(id => {
        document.getElementById(id).setAttribute('visible', visible);
      });
      document.getElementById('bg-sky').setAttribute('visible', visible);
      //show or hide Youtube container
      document.getElementById('yt-container').style.display = visible ? 'block' : 'none';
    }
    
  //VR keyboard

  let vrInputVal = '';

  const boardRows = [
  ['1','2','3','4','5','6','7','8','9','0'],
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l','.'],
  ['z','x','c','v','b','n','m','/','_','-'],
  ['SPACE','BACK','CLEAR','LOAD']
];

//builds keyboard inside vr-keyboard entity
function buildVRBoard() {
  const container = document.getElementById('vr-keyboard');
  const keyWidth = 0.28;
  const keyHeight = 0.28;
  const keyDepth = 0.08;
  const xSpacing = 0.32;
  const ySpacing = 0.33;
  const startY = 0.6;

  boardRows.forEach((row, rowIndex) => {
    const rowWidth = row.length;
    const startX = -(rowWidth - 1) * xSpacing / 2;

    row.forEach((key, colIndex) => {
      const isWide = ['SPACE','BACK','CLEAR','LOAD'].includes(key);
      const w = isWide ? 0.7 : keyWidth;
      const xPos = isWide
        ? -1.05 + ['SPACE','BACK','CLEAR','LOAD'].indexOf(key) * 0.75
        : startX + colIndex * xSpacing;
      const yPos = startY - rowIndex * ySpacing;

      //key box
      const box = document.createElement('a-box');
      box.setAttribute('width', w);
      box.setAttribute('height', keyHeight);
      box.setAttribute('depth', keyDepth);
      box.setAttribute('position', `${xPos} ${yPos} 0.05`);
      box.setAttribute('color', isWide ? '#1a4a6c' : '#1a3a5c');
      box.setAttribute('class', 'clickable');
      box.setAttribute('data-key', key);

      //key label
      const text = document.createElement('a-text');
      text.setAttribute('value', key === 'SPACE' ? 'SPC' : key === 'BACK' ? 'DEL' : key === 'CLEAR' ? 'CLR' : key === 'LOAD' ? 'ENTR' : key);
      text.setAttribute('align', 'center');
      text.setAttribute('position', '0 0 0.05');
      text.setAttribute('color', key === 'LOAD' ? '#4fc3f7' : 'white');
      text.setAttribute('width', isWide ? 2 : 1.5);

      box.appendChild(text);

      //hover effect
      box.addEventListener('mouseenter', () => {
        box.setAttribute('scale', '1.15 1.15 1.15');
        box.setAttribute('color', '#4fc3f7');
      });
      box.addEventListener('mouseleave', () => {
        box.setAttribute('scale', '1 1 1');
        box.setAttribute('color', isWide ? '#1a4a6c' : '#1a3a5c');
      });

      //click handler
      box.addEventListener('click', () => {
        handleVRKey(key);
      });

      container.appendChild(box);
    });
  });
}

//handles key presses from the VR keyboard
function handleVRKey(key) {
  if (key === 'BACK') {
    vrInputVal = vrInputVal.slice(0, -1);
  } else if (key === 'CLEAR') {
    vrInputVal = '';
  } else if (key === 'SPACE') {
    vrInputVal += ' ';
  } else if (key === 'LOAD') {
    //copy typed value to the 2D input and load
    document.getElementById('video-360-input').value = vrInputVal;
    load360Video();
    //hide keyboard after loading
    document.getElementById('vr-keyboard-panel').setAttribute('visible', false);
  } else {
    vrInputVal += key;
  }

  //update display text
  document.getElementById('vr-input-display').setAttribute('value',
    vrInputVal.length > 38
      ? '...' + vrInputVal.slice(-38)
      : vrInputVal || 'Type URL here...'
  );
}
//load 360 vid from URL input
function load360Video() {
  const url = document.getElementById('video-360-input').value.trim();
  if (!url) return;

  const vid = document.getElementById('video360');

  //pause and swap the source
  vid.pause();
  vid.src = url;
  vid.muted=true; //mute to allow autoplay 
  vid.load();

  //loading overlay
  document.getElementById('loading').classList.remove('hidden');

  //hide loading 
  vid.addEventListener('playing', () => {
    document.getElementById('loading').classList.add('hidden');
    vid.muted = false; //unmute after playback starts
  }, { once: true });
  vid.play().catch(err => console.warn('Video play blocked:', err));

  //update the sphere src to match
  document.getElementById('videosphere').setAttribute('src', url);
}
    //switch between flat and 360 modes
    function switchMode(mode) {
      currentMode = mode;
      //show keyboard button in VR menu
      document.getElementById('vr-btn-keyboard').setAttribute('visible', mode === '360');
      

      //update buttons to active state
      document.getElementById('btn-flat').classList.toggle('active', mode === 'flat');
      document.getElementById('btn-360').classList.toggle('active', mode === '360');

      //swap which input is visible
      document.getElementById('video-id-input').style.display = mode === 'flat' ? 'block' : 'none';
      document.getElementById('video-360-input').style.display = mode === '360' ? 'block' : 'none';
      document.getElementById('btn-load-360').style.display = mode === '360' ? 'block' : 'none';
      if (mode === '360') {
        //360 mode: hide flat elements, show sphere
        showFlatElements(false);
        document.getElementById('videosphere').setAttribute('visible', true);
        const vid = document.getElementById('video360');
        vid.muted = true; 
      //hide loading when video starts playing
      vid.addEventListener('playing', () => {
      document.getElementById('loading').classList.add('hidden');
      vid.muted = false; //unmute after playback starts
}, { once: true });
//catch autoplay block errors
vid.play().catch(err => console.warn('Video play blocked:', err));
//highlight active button
document.getElementById('vr-btn-360').setAttribute('color', '#4fc3f7');
document.getElementById('vr-btn-flat').setAttribute('color', '#1a3a5c');
//pause Youtube if playing
if (ytPlayer) ytPlayer.pauseVideo();
} else {
        //flat mode: show flat elements, hide videosphere
        showFlatElements(true);
        document.getElementById('videosphere').setAttribute('visible', false);
        document.getElementById('video360').pause();
        
        document.getElementById('vr-btn-flat').setAttribute('color', '#4fc3f7');
        document.getElementById('vr-btn-360').setAttribute('color', '#1a3a5c');
        //load new video ID if changed 
        const inputId = document.getElementById('video-id-input').value.trim();
        loadYoutubeVideo(inputId);
      }
      document.getElementById('vr-menu').setAttribute('visible', false);


}

//load or reload youtube video by ID
function loadYoutubeVideo(videoId) {
if (!videoId) return;
if (ytPlayer && ytPlayer.loadVideoById) {
//player already exists so swap the video
ytPlayer.loadVideoById(videoId);
} else {
        //initialise player
        initYoutubePlayer(videoId);
      }
    }

    //initialise youtube iframe player
    function initYoutubePlayer(videoId) {
      ytPlayer = new YT.Player('yt-player', {
        width: '854',
        height: '480',
        videoId: videoId,
        playerVars: {
          rel:            0,  
          controls:       1,  
          modestbranding: 1,  
          autoplay:       1,  
          fs:             1,  
          iv_load_policy: 3,  
          disablekb:      1,  
          playsinline:    1,  
        },
        events: {
          onReady(event) {
            document.getElementById('loading').classList.add('hidden');
            event.target.playVideo();
          },
          onStateChange(event) {
            //auto-restart when vid ends 
            if (event.data === YT.PlayerState.ENDED) {
              ytPlayer.seekTo(0, true);
              ytPlayer.playVideo();
            }
          }
        }
      });
    }

    //youtube iframe API ready callback 
    window.onYouTubeIframeAPIReady = function () {
      const startId = document.getElementById('video-id-input').value.trim();
      initYoutubePlayer(startId);
    };

    //VR button events and hover effects
    document.addEventListener('DOMContentLoaded', () => {
    

      //toggle VR menu
      document.getElementById('vr-menu-toggle').addEventListener('click', () => {
        const menu = document.getElementById('vr-menu');
        const isVisible = menu.getAttribute('visible') === 'true';
        menu.setAttribute('visible', !isVisible);
      });

      //VR flat mode button
      document.getElementById('vr-btn-flat').addEventListener('click', () => {
        switchMode('flat');
      });

      //VR 360 mode button
      document.getElementById('vr-btn-360').addEventListener('click', () => {
        switchMode('360');
      });

      //VR close menu button
      document.getElementById('vr-btn-close').addEventListener('click', () => {
        document.getElementById('vr-menu').setAttribute('visible', false);
      });

      //hover scale effect on all clickable VR elements
      document.querySelectorAll('.clickable').forEach(el => {
        el.addEventListener('mouseenter', () => {
          el.setAttribute('scale', '1.06 1.06 1.06');
        });
        el.addEventListener('mouseleave', () => {
          el.setAttribute('scale', '1 1 1');
        });
      });
      //open VR keyboard 
      document.getElementById('vr-btn-keyboard').addEventListener('click', () => {
      vrInputVal = '';
      document.getElementById('vr-input-display').setAttribute('value', 'Type URL here...');
      document.getElementById('vr-keyboard-panel').setAttribute('visible', true);
      document.getElementById('vr-menu').setAttribute('visible', false);
});

      //close VR keyboard 
      document.getElementById('vr-keyboard-close').addEventListener('click', () => {
      document.getElementById('vr-keyboard-panel').setAttribute('visible', false);
});
buildVRBoard();
    });
  </script>

  <!-- youtube iframe API  -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
