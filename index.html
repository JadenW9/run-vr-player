<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Player</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }

    /* youtube iframe container floats over the aframe */
    #yt-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -62%);
      width: 854px;
      height: 480px;
      z-index: 10;
      pointer-events: auto;
    }
    #yt-player {
      width: 100%;
      height: 100%;
    }

    /* loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 1.4rem;
      z-index: 100;
    }
    #loading.hidden { display: none; }

    /* tap to play fallback */
    #tap-to-play {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      color: white;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 1.6rem;
      z-index: 99;
      cursor: pointer;
    }

    /* mode switcher UI */
    #mode-switcher {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 50;
      font-family: sans-serif;
    }
    #mode-switcher button {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      background: #1a3a5c;
      color: white;
      transition: background 0.2s;
    }
    #mode-switcher button:hover { background: #4fc3f7; color: #000; }
    #mode-switcher button.active { background: #4fc3f7; color: #000; }

    #video-id-input {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      width: 200px;
      background: #111e2b;
      color: white;
    }
    #video-360-input {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      background: #111e2b;
      color: white;
    }
    #video-360-input::placeholder { color: #556; }
    #video-id-input::placeholder { color: #556; }
  </style>
</head>
<body>

  <!-- loading overlay -->
  <div id="loading">Loading VR Player...<br><small>(Please wait)</small></div>

  <!-- tap to play fallback if autoplay blocked -->
  <div id="tap-to-play" onclick="resumeVideo()">
    Tap to Play
    <small style="font-size:1rem; margin-top:10px; opacity:0.7;">
      Browser blocked autoplay
    </small>
  </div>

  <!-- youtube player container on top of aframe canvas -->
  <div id="yt-container">
    <div id="yt-player"></div>
  </div>

  <!-- mode switcher -->
  <div id="mode-switcher">
    <input
      id="video-id-input"
      type="text"
      placeholder="Youtube Video ID"
      value="yu8ShH3GQFU"
    />
    <!-- 360 URL input -->
    <input
      id="video-360-input"
      type="text"
      placeholder="360 Video URL (.m3u8 or .mp4)"
      style="display: none; width: 280px;"
    />
    <button id="btn-flat" class="active" onclick="switchMode('flat')">
      Youtube Mode
    </button>
    <button id="btn-360" onclick="switchMode('360')">
      360 Mode
    </button>
    <!-- load button for 360 mode -->
    <button
      id="btn-load-360"
      style="display: none;"
      onclick="load360Video()"
    >
      Load
    </button>
  </div>

  <!-- aframe scene for VR video playback -->
  <a-scene
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
    background="color: #0a0a1a"
  >

    <!-- assets with timeout to prevent stall on large video -->
    <a-assets timeout="3000">
      <img id="sky-tex"
        src="https://cdn.aframe.io/a-painter/images/sky.jpg"
        crossorigin="anonymous" />
      <video
        id="video360"
        playsinline
        loop
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <!-- sky background for flat mode -->
    <a-sky id="bg-sky" src="#sky-tex" rotation="0 -90 0"></a-sky>

    <!-- 360 videosphere - src set after scene loads -->
    <a-videosphere
      id="videosphere"
      rotation="0 -90 0"
      visible="false"
    ></a-videosphere>

    <!-- main video screen - raised higher so bottom edge clears floor -->
    <a-plane
      id="video-screen"
      position="0 2.3 -4"
      width="7" height="3.9"
      color="#111111"
      material="shader: flat"
    ></a-plane>

    <!-- VR menu toggle button -->
    <a-box
      id="vr-menu-toggle"
      position="5.0 2.2 -5"
      width="1.8" height="0.55" depth="0.25"
      color="#1a3a5c"
      class="clickable"
    >
      <a-text
        value="Menu"
        align="center"
        position="0 0 0.13"
        color="white"
        width="4"
      ></a-text>
    </a-box>

    <!-- VR menu panel background -->
    <a-entity id="vr-menu" position="0 1.6 -2" visible="false">
      <a-plane
        width="2.8" height="3.4"
        color="#0d1b2a"
        material="opacity: 0.95; shader: flat"
        position="0 0 0"
      ></a-plane>
      <a-text
        value="SELECT MODE"
        align="center"
        position="0 1.2 0.01"
        color="#4fc3f7"
        width="5"
      ></a-text>
    </a-entity>

    <!-- menu buttons - larger hit area, more depth, wider width -->

    <!-- youtube mode button -->
    <a-box
      id="vr-btn-flat"
      position="0 2.05 -1.88"
      width="2.4" height="0.55" depth="0.25"
      color="#1a3a5c"
      class="clickable"
      visible="false"
    >
      <a-text
        value="Youtube Video"
        align="center"
        position="0 0 0.13"
        color="white"
        width="4.5"
      ></a-text>
    </a-box>

    <!-- 360 mode button -->
    <a-box
      id="vr-btn-360"
      position="0 1.4 -1.88"
      width="2.4" height="0.55" depth="0.25"
      color="#1a3a5c"
      class="clickable"
      visible="false"
    >
      <a-text
        value="360 Video"
        align="center"
        position="0 0 0.13"
        color="white"
        width="4.5"
      ></a-text>
    </a-box>

    <!-- type 360 url button -->
    <a-box
      id="vr-btn-keyboard"
      position="0 0.75 -1.88"
      width="2.4" height="0.55" depth="0.25"
      color="#2e6b3e"
      class="clickable"
      visible="false"
    >
      <a-text
        value="Type 360 URL"
        align="center"
        position="0 0 0.13"
        color="white"
        width="4.5"
      ></a-text>
    </a-box>

    <!-- close menu button -->
    <a-box
      id="vr-btn-close"
      position="0 0.1 -1.88"
      width="2.4" height="0.55" depth="0.25"
      color="#5c1a1a"
      class="clickable"
      visible="false"
    >
      <a-text
        value="Close"
        align="center"
        position="0 0 0.13"
        color="white"
        width="4"
      ></a-text>
    </a-box>

    <!-- camera -->
    <a-entity position="0 1.6 0">
      <a-camera
        look-controls="pointerLockEnabled: false"
        wasd-controls="enabled: false"
        fov="80"
      >
        <!-- cursor - reduced fuse timeout for faster response -->
        <a-cursor
          color="#4fc3f7"
          fuse="true"
          fuse-timeout="800"
          raycaster="objects: .clickable; interval: 20; far: 15"
          animation__click="
            property: scale;
            startEvents: click;
            easing: easeInCubic;
            dur: 150;
            from: 0.1 0.1 0.1;
            to: 1 1 1"
        ></a-cursor>
      </a-camera>
    </a-entity>

    <!-- floor -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="30" height="30"
      color="#0d1b2a"
      material="shader: flat"
    ></a-plane>

    <!-- ambient lighting -->
    <a-light type="ambient" color="#334" intensity="2"></a-light>

    <!-- left controller laser pointer -->
